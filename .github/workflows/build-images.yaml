name: Build and push workspace images

on:
  push:
    branches: [main]
    paths:
      - "ubuntu/dockerfiles/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-cli:
    name: Build ubuntu-${{ matrix.version }}-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ["20.04", "22.04", "24.04"]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ubuntu
          file: ubuntu/dockerfiles/ubuntu-${{ matrix.version }}-cli.Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/ubuntu-${{ matrix.version }}-cli:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/ubuntu-${{ matrix.version }}-cli:cache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/ubuntu-${{ matrix.version }}-cli:cache,mode=max

  build-xfce:
    name: Build ubuntu-${{ matrix.version }}-xfce
    runs-on: ubuntu-latest
    needs: build-cli
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        version: ["20.04", "22.04", "24.04"]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ubuntu
          file: ubuntu/dockerfiles/ubuntu-${{ matrix.version }}-xfce.Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/ubuntu-${{ matrix.version }}-xfce:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/ubuntu-${{ matrix.version }}-xfce:cache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/ubuntu-${{ matrix.version }}-xfce:cache,mode=max
