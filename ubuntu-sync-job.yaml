apiVersion: batch/v1
kind: Job
metadata:
  name: coder-template-sync-ubuntu
  namespace: coder
  annotations:
    # Force-replace this Job (immutable resource) whenever its spec changes,
    # which happens automatically when the ConfigMap hash suffix rolls over.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: sync
          image: ghcr.io/coder/coder:v2.32.0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for Coder to be ready..."
              until curl -sf "$CODER_URL/healthz" >/dev/null 2>&1; do
                sleep 5
              done
              echo "Coder ready. Pushing template..."
              ls -la /workspace
              rm -rf /tmp/template
              mkdir -p /tmp/template/files /tmp/template/scripts /tmp/template/dockerfiles/scripts
              cp -L /workspace/main.tf /tmp/template/main.tf

              cp -L /workspace/files.novnc-index.html /tmp/template/files/novnc-index.html
              cp -L /workspace/files.novnc-nginx.conf /tmp/template/files/novnc-nginx.conf
              cp -L /workspace/files.vnc-config /tmp/template/files/vnc-config

              cp -L /workspace/scripts.cli-startup.sh /tmp/template/scripts/cli-startup.sh
              cp -L /workspace/scripts.desktop-startup.sh.tftpl /tmp/template/scripts/desktop-startup.sh.tftpl
              cp -L /workspace/scripts.ensure-home-pvc.sh.tftpl /tmp/template/scripts/ensure-home-pvc.sh.tftpl
              cp -L /workspace/scripts.init-home.sh /tmp/template/scripts/init-home.sh
              cp -L /workspace/scripts.vnc-xstartup.sh.tftpl /tmp/template/scripts/vnc-xstartup.sh.tftpl
              cp -L /workspace/scripts.xfce-settings.sh /tmp/template/scripts/xfce-settings.sh

              cp -L /workspace/dockerfiles.ubuntu-20.04-cli.Dockerfile /tmp/template/dockerfiles/ubuntu-20.04-cli.Dockerfile
              cp -L /workspace/dockerfiles.ubuntu-20.04-xfce.Dockerfile /tmp/template/dockerfiles/ubuntu-20.04-xfce.Dockerfile
              cp -L /workspace/dockerfiles.ubuntu-22.04-cli.Dockerfile /tmp/template/dockerfiles/ubuntu-22.04-cli.Dockerfile
              cp -L /workspace/dockerfiles.ubuntu-22.04-xfce.Dockerfile /tmp/template/dockerfiles/ubuntu-22.04-xfce.Dockerfile
              cp -L /workspace/dockerfiles.ubuntu-24.04-cli.Dockerfile /tmp/template/dockerfiles/ubuntu-24.04-cli.Dockerfile
              cp -L /workspace/dockerfiles.ubuntu-24.04-xfce.Dockerfile /tmp/template/dockerfiles/ubuntu-24.04-xfce.Dockerfile

              cp -L /workspace/dockerfiles.scripts.base-packages.sh /tmp/template/dockerfiles/scripts/base-packages.sh
              cp -L /workspace/dockerfiles.scripts.configure-apt-cache.sh /tmp/template/dockerfiles/scripts/configure-apt-cache.sh
              cp -L /workspace/dockerfiles.scripts.desktop-packages.sh /tmp/template/dockerfiles/scripts/desktop-packages.sh
              cp -L /workspace/dockerfiles.scripts.install-code-server.sh /tmp/template/dockerfiles/scripts/install-code-server.sh
              cp -L /workspace/dockerfiles.scripts.setup-coder-user.sh /tmp/template/dockerfiles/scripts/setup-coder-user.sh
              cp -L /workspace/dockerfiles.scripts.xfce-packages.sh /tmp/template/dockerfiles/scripts/xfce-packages.sh

              find /tmp/template -maxdepth 3 -type f -print | sort
              coder templates push \
                --directory /tmp/template \
                --yes \
                Ubuntu
              echo "Done."
          env:
            - name: CODER_URL
              value: https://coder.ediz.dev
            - name: CODER_ORGANIZATION
              value: default
            - name: CODER_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: coder-template-token
                  key: token
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          configMap:
            name: coder-template-ubuntu
